# f5-cert-push.conf for MANUALLY UPLOADED certificates, installed by f5-cert-install.sh
#
# Install as /etc/f5-cert-push.conf (root:root, mode 600). See docs/MANUAL-UPLOAD.md.
#
# Each [cert:NAME] reads from /etc/f5-certs/NAME/current, which f5-cert-install.sh
# maintains. NAME must match the upload folder: /srv/f5-certs/incoming/NAME/

[defaults]
# Uploaded files are checked strictly: the chain must be present and must verify,
# and nothing that expires within a week is pushed.
chain_check    = fail
min_days_valid = 7

# If a virtual server does not serve the new certificate after the switch, put the
# old one back automatically.
auto_rollback      = yes
verify_unreachable = warn

# Cron cannot answer "trust this host key?": pin every BIG-IP's key beforehand
# (docs/OPERATIONS.md 1.3).
strict_host_key_checking = yes

keep             = 4
backup_dir_local = /var/backups/f5-cert-push
log_file         = /var/log/f5-cert-push.log


############################################################################
# BIG-IPs
############################################################################
[f5:dc1-a]
host    = 10.0.0.11
ssh_key = /root/.ssh/f5_push_ecdsa

[f5:dc1-b]
host    = 10.0.0.12
ssh_key = /root/.ssh/f5_push_ecdsa

[f5:dc2-a]
host    = 10.20.0.11
ssh_key = /root/.ssh/f5_push_ecdsa


############################################################################
# Certificates (one per upload folder)
############################################################################
[cert:www]
le_dir        = /etc/f5-certs/www/current
object_prefix = www-example

[cert:api]
le_dir        = /etc/f5-certs/api/current
object_prefix = api-example


############################################################################
# Deployments: which profiles on which BIG-IPs use each certificate
############################################################################
[deploy:www]
env     = prod
f5      = dc1-a, dc2-a
cert    = www
profile = www-clientssl
profile = www-redirect-clientssl
verify  = 10.1.10.10:443 www.example.com

[deploy:api]
env     = prod
f5      = dc1-a, dc2-a
cert    = api
profile = api-clientssl
verify  = 10.1.10.20:443 api.example.com
