<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 820" width="1060" height="820" role="img" aria-label="Lab network (example addresses, as used in the commands of this guide)"><title>Lab network (example addresses, as used in the commands of this guide)</title><style>
.bg{fill:#ffffff}.box{fill:#f4f7fb;stroke:#5b6577;stroke-width:1.5}.f5{fill:#fdf1f1;stroke:#c0392b;stroke-width:1.8}
.rt{fill:#eef6ee;stroke:#3c8d40;stroke-width:1.5}.net{fill:#eaf2fc;stroke:#0b5cad;stroke-width:1.5}
.vs{fill:#fff7e0;stroke:#b8860b;stroke-width:1.5}.bus{stroke:#0b5cad;stroke-width:4;fill:none}
.ibus{stroke:#7a4fb5;stroke-width:4;fill:none}.lk{stroke:#5b6577;stroke-width:2;fill:none}
.port{fill:#1d2330}.dot{fill:#0b5cad}.idot{fill:#7a4fb5}
text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#1d2330;font-size:12.5px}
.b{font-weight:700;font-size:14px}.s{font-size:11.5px;fill:#4a5466}.n{font-weight:700;fill:#0b5cad}
.i{font-weight:700;fill:#7a4fb5}.r{fill:#a12d22;font-weight:700}
.ip{font-family:ui-monospace,Consolas,Menlo,monospace;font-size:12px}
@media (prefers-color-scheme:dark){
.bg{fill:#14171d}.box{fill:#1d222c;stroke:#9aa5b8}.f5{fill:#2a1a1a;stroke:#ff7a6b}.rt{fill:#16261a;stroke:#6cc070}
.net{fill:#14243a;stroke:#6cb2ff}.vs{fill:#2a2412;stroke:#e3b341}.bus{stroke:#6cb2ff}.ibus{stroke:#b48cf0}
.lk{stroke:#9aa5b8}.port{fill:#e4e8ef}.dot{fill:#6cb2ff}.idot{fill:#b48cf0}text{fill:#e4e8ef}.s{fill:#aab4c6}
.n{fill:#6cb2ff}.i{fill:#b48cf0}.r{fill:#ff8c7f}}
</style><rect class="bg" x="0" y="0" width="1060" height="820" rx="10"/><text x="20" y="30" class="b">Lab network (example addresses, as used in the commands of this guide)</text><rect class="net" x="35" y="50" width="200" height="62" rx="31"/><text x="135" y="76" class="b" text-anchor="middle">Internet</text><text x="135" y="96" class="s" text-anchor="middle">clients; github.com (section 0)</text><line class="lk" x1="135" y1="112" x2="135" y2="150"/><rect class="rt" x="60" y="150" width="150" height="490" rx="8"/><text x="135" y="178" class="b" text-anchor="middle">Router /</text><text x="135" y="196" text-anchor="middle">firewall</text><text x="135" y="222" class="s" text-anchor="middle">default gateway</text><text x="135" y="238" class="s" text-anchor="middle">(.1) of each</text><text x="135" y="254" class="s" text-anchor="middle">network it</text><text x="135" y="270" class="s" text-anchor="middle">touches</text><line class="bus" x1="210" y1="250" x2="1035" y2="250"/><text x="222" y="270" class="s">Your network (any addresses that can reach the management network)</text><rect class="box" x="280" y="144" width="250" height="76" rx="6"/><text x="292" y="166" class="b">Your PC</text><text x="292" y="184">SSH to the Linux machine;</text><text x="292" y="202">browser: BIG-IP GUI and lab sites</text><line class="lk" x1="405" y1="220" x2="405" y2="250"/><circle class="dot" cx="405" cy="250" r="5"/><rect class="box" x="560" y="126" width="415" height="94" rx="6"/><text x="572" y="148" class="b">Linux machine (bash 4.2+, openssl, ssh)</text><text x="572" y="166">runs f5-cert-push and the lab scripts;</text><text x="572" y="184">SSH (TCP 22) to the management IPs;</text><text x="572" y="202">internet only for the section 0 download</text><line class="lk" x1="767.5" y1="220" x2="767.5" y2="250"/><circle class="dot" cx="767.5" cy="250" r="5"/><line class="bus" x1="210" y1="330" x2="1035" y2="330"/><text x="222" y="322" class="ip">.1</text><text x="250" y="320" class="n">Management network 192.0.2.0/24: each BIG-IP&#x27;s mgmt port (SSH, GUI)</text><rect class="f5" x="440" y="400" width="270" height="130" rx="8"/><text x="454" y="426" class="b">f5a</text><text x="696" y="426" class="r" text-anchor="end">BIG-IP: active</text><text x="454" y="454" class="s">--host for build-lab.sh and the tool;</text><text x="454" y="471" class="s">the lab is built here and copied</text><text x="454" y="488" class="s">to the peer by config sync</text><line class="lk" x1="575" y1="330" x2="575" y2="400"/><circle class="dot" cx="575" cy="330" r="5"/><rect class="port" x="568" y="393" width="14" height="14"/><text x="587" y="368" class="s">mgmt</text><text x="587" y="384" class="ip">192.0.2.10</text><rect class="port" x="513" y="523" width="14" height="14"/><line class="lk" x1="520" y1="530" x2="520" y2="620"/><circle class="dot" cx="520" cy="620" r="5"/><text x="510" y="554" class="s" text-anchor="end">1.2 (VLAN external)</text><text x="510" y="570" class="ip" text-anchor="end">self 198.51.100.6</text><rect class="port" x="623" y="523" width="14" height="14"/><line class="lk" x1="630" y1="530" x2="630" y2="598"/><circle class="idot" cx="630" cy="598" r="5"/><text x="640" y="592" class="s">1.1 (VLAN internal)</text><text x="640" y="608" class="s">not used by the lab</text><rect class="f5" x="750" y="400" width="270" height="130" rx="8"/><text x="764" y="426" class="b">f5b</text><text x="1006" y="426" class="r" text-anchor="end">BIG-IP: standby</text><text x="764" y="454" class="s">--peer for remove-lab.sh; gets the</text><text x="764" y="471" class="s">lab by config sync; takes over</text><text x="764" y="488" class="s">after a failover (section 15)</text><line class="lk" x1="885" y1="330" x2="885" y2="400"/><circle class="dot" cx="885" cy="330" r="5"/><rect class="port" x="878" y="393" width="14" height="14"/><text x="897" y="368" class="s">mgmt</text><text x="897" y="384" class="ip">192.0.2.11</text><rect class="port" x="823" y="523" width="14" height="14"/><line class="lk" x1="830" y1="530" x2="830" y2="620"/><circle class="dot" cx="830" cy="620" r="5"/><text x="820" y="554" class="s" text-anchor="end">1.2 (VLAN external)</text><text x="820" y="570" class="ip" text-anchor="end">self 198.51.100.7</text><rect class="port" x="933" y="523" width="14" height="14"/><line class="lk" x1="940" y1="530" x2="940" y2="598"/><circle class="idot" cx="940" cy="598" r="5"/><text x="950" y="592" class="s">1.1 (VLAN internal)</text><text x="950" y="608" class="s">not used by the lab</text><line class="bus" x1="210" y1="620" x2="1035" y2="620"/><text x="222" y="612" class="ip">.1</text><text x="222" y="642" class="n">External VLAN (interface 1.2)</text><text x="222" y="659">198.51.100.0/24 · client side</text><text x="222" y="676">floating self .5 (on the active unit)</text><line class="lk" x1="500" y1="620" x2="500" y2="700"/><circle class="dot" cx="500" cy="620" r="5"/><rect class="vs" x="222" y="700" width="390" height="64" rx="6"/><text x="234" y="722" class="b">Lab virtual servers (build-lab.sh, port 443)</text><text x="234" y="740">lab-vs1 .201 · lab-vs2 .202 · lab-vs3 .203</text><text x="20" y="786" class="s">Internal VLAN (interface 1.1, the server side): the lab and f5-cert-push neither use nor change it.</text><text x="20" y="802" class="s">Standalone BIG-IP: only the active unit.</text></svg>
