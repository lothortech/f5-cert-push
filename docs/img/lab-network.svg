<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 790" width="1000" height="790" role="img" aria-label="Lab network (example addresses, as used in the commands of this guide)"><title>Lab network (example addresses, as used in the commands of this guide)</title><style>

.bg{fill:#ffffff}.box{fill:#f4f7fb;stroke:#5b6577;stroke-width:1.5}.f5{fill:#fdf1f1;stroke:#c0392b;stroke-width:1.8}

.rt{fill:#eef6ee;stroke:#3c8d40;stroke-width:1.5}.net{fill:#eaf2fc;stroke:#0b5cad;stroke-width:1.5}

.vs{fill:#fff7e0;stroke:#b8860b;stroke-width:1.5}.bus{stroke:#0b5cad;stroke-width:4;fill:none}

.lk{stroke:#5b6577;stroke-width:2;fill:none}.ha{stroke:#c0392b;stroke-width:3;fill:none;stroke-dasharray:7 4}

.port{fill:#1d2330}.dot{fill:#0b5cad}

text{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;fill:#1d2330;font-size:12.5px}

.b{font-weight:700;font-size:14px}.s{font-size:11.5px;fill:#4a5466}.n{font-weight:700;fill:#0b5cad}.r{fill:#a12d22;font-weight:700}

.ip{font-family:ui-monospace,Consolas,Menlo,monospace;font-size:12px}

@media (prefers-color-scheme:dark){

.bg{fill:#14171d}.box{fill:#1d222c;stroke:#9aa5b8}.f5{fill:#2a1a1a;stroke:#ff7a6b}.rt{fill:#16261a;stroke:#6cc070}

.net{fill:#14243a;stroke:#6cb2ff}.vs{fill:#2a2412;stroke:#e3b341}.bus{stroke:#6cb2ff}.lk{stroke:#9aa5b8}.ha{stroke:#ff7a6b}

.port{fill:#e4e8ef}.dot{fill:#6cb2ff}text{fill:#e4e8ef}.s{fill:#aab4c6}.n{fill:#6cb2ff}.r{fill:#ff8c7f}}

</style><rect class="bg" x="0" y="0" width="1000" height="790" rx="10"/><text x="20" y="30" class="b">Lab network (example addresses, as used in the commands of this guide)</text><rect class="net" x="35" y="50" width="200" height="62" rx="31"/><text x="135" y="76" class="b" text-anchor="middle">Internet</text><text x="135" y="96" class="s" text-anchor="middle">github.com (section 0)</text><line class="lk" x1="135" y1="112" x2="135" y2="150"/><rect class="rt" x="60" y="150" width="150" height="510" rx="8"/><text x="135" y="178" class="b" text-anchor="middle">Router /</text><text x="135" y="196" text-anchor="middle">firewall</text><text x="135" y="222" class="s" text-anchor="middle">default gateway</text><text x="135" y="238" class="s" text-anchor="middle">(.1) of each</text><text x="135" y="254" class="s" text-anchor="middle">network; routes</text><text x="135" y="270" class="s" text-anchor="middle">between them</text><line class="bus" x1="210" y1="250" x2="975" y2="250"/><text x="222" y="270" class="s">Your network (any addresses that can reach the management network)</text><rect class="box" x="280" y="144" width="250" height="76" rx="6"/><text x="292" y="166" class="b">Your PC</text><text x="292" y="184">SSH to the Linux machine;</text><text x="292" y="202">browser: BIG-IP GUI and lab sites</text><line class="lk" x1="405" y1="220" x2="405" y2="250"/><circle class="dot" cx="405" cy="250" r="5"/><rect class="box" x="560" y="126" width="415" height="94" rx="6"/><text x="572" y="148" class="b">Linux machine (bash 4.2+, openssl, ssh)</text><text x="572" y="166">runs f5-cert-push and the lab scripts;</text><text x="572" y="184">SSH (TCP 22) to the management IPs;</text><text x="572" y="202">internet only for the section 0 download</text><line class="lk" x1="767" y1="220" x2="767" y2="250"/><circle class="dot" cx="767" cy="250" r="5"/><line class="bus" x1="210" y1="330" x2="975" y2="330"/><text x="222" y="322" class="ip">.1</text><text x="250" y="320" class="n">Management network 192.0.2.0/24: each BIG-IP&#x27;s mgmt port (SSH, GUI)</text><rect class="f5" x="265" y="400" width="280" height="150" rx="8"/><text x="279" y="426" class="b">f5a</text><text x="531" y="426" class="r" text-anchor="end">BIG-IP: active</text><text x="279" y="454" class="s">--host for build-lab.sh and the</text><text x="279" y="471" class="s">tool; the lab is built here and</text><text x="279" y="488" class="s">copied to the peer by config sync</text><line class="lk" x1="405" y1="330" x2="405" y2="400"/><circle class="dot" cx="405" cy="330" r="5"/><rect class="port" x="398" y="393" width="14" height="14"/><text x="417" y="368" class="s">mgmt</text><text x="417" y="384" class="ip">192.0.2.10</text><rect class="port" x="398" y="543" width="14" height="14"/><line class="lk" x1="405" y1="550" x2="405" y2="640"/><circle class="dot" cx="405" cy="640" r="5"/><text x="417" y="576" class="s">1.2 (VLAN external)</text><text x="417" y="592" class="ip">self 198.51.100.6</text><rect class="port" x="538" y="508" width="14" height="14"/><text x="531" y="520" class="ip" text-anchor="end">1.1 self 203.0.113.6</text><rect class="f5" x="695" y="400" width="280" height="150" rx="8"/><text x="709" y="426" class="b">f5b</text><text x="961" y="426" class="r" text-anchor="end">BIG-IP: standby</text><text x="709" y="454" class="s">--peer for remove-lab.sh; gets</text><text x="709" y="471" class="s">the lab by config sync; takes</text><text x="709" y="488" class="s">over after a failover (section 15)</text><line class="lk" x1="835" y1="330" x2="835" y2="400"/><circle class="dot" cx="835" cy="330" r="5"/><rect class="port" x="828" y="393" width="14" height="14"/><text x="847" y="368" class="s">mgmt</text><text x="847" y="384" class="ip">192.0.2.11</text><rect class="port" x="828" y="543" width="14" height="14"/><line class="lk" x1="835" y1="550" x2="835" y2="640"/><circle class="dot" cx="835" cy="640" r="5"/><text x="847" y="576" class="s">1.2 (VLAN external)</text><text x="847" y="592" class="ip">self 198.51.100.7</text><rect class="port" x="688" y="508" width="14" height="14"/><text x="709" y="520" class="ip">1.1 self 203.0.113.7</text><line class="ha" x1="545" y1="515" x2="695" y2="515"/><text x="620" y="410" class="r" text-anchor="middle">Internal VLAN</text><text x="620" y="423.5" class="s" text-anchor="middle">(1.1)</text><text x="620" y="437" class="s" text-anchor="middle">203.0.113.0/24</text><text x="620" y="450.5" class="s" text-anchor="middle">floating .5</text><text x="620" y="464" class="s" text-anchor="middle">config sync,</text><text x="620" y="477.5" class="s" text-anchor="middle">failover,</text><text x="620" y="491" class="s" text-anchor="middle">mirroring</text><line class="bus" x1="210" y1="640" x2="975" y2="640"/><text x="222" y="632" class="ip">.1</text><text x="222" y="662" class="n">External VLAN (interface 1.2) 198.51.100.0/24: floating self .5 on the active unit</text><line class="lk" x1="905" y1="640" x2="905" y2="680"/><circle class="dot" cx="905" cy="640" r="5"/><rect class="vs" x="560" y="680" width="415" height="64" rx="6"/><text x="572" y="702" class="b">Lab virtual servers (made by build-lab.sh, port 443)</text><text x="572" y="720">lab-vs1 .201 · lab-vs2 .202 · lab-vs3 .203   (198.51.100.x)</text><text x="20" y="776" class="s">Standalone BIG-IP: only the active unit, no internal HA link. Lines: blue = networks, grey = connections, red dashed = HA link.</text></svg>
